name: Release

# Builds ai-by-roadmap-<version>.zip and publishes it as a GitHub Release whenever
# a v* tag is pushed. Run manually (Actions → Release → Run workflow) to backfill
# an existing tag; re-running replaces the zip on that release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.3.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Plugin source at the tag…
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # …packaged with the current build tooling, so tags that predate
      # bin/build-zip.sh can still be backfilled.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .tooling

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Build zip
        id: build
        run: PLUGIN_DIR="$GITHUB_WORKSPACE" .tooling/bin/build-zip.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ai-by-roadmap ${{ steps.build.outputs.version }}
          body_path: .tooling/build/notes.md
          files: .tooling/${{ steps.build.outputs.zip }}
          fail_on_unmatched_files: true
